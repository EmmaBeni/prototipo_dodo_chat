<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Escudo · Dodo Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Roboto:wght@500;700;900&display=swap">
<style>
/* Layout: header blanco con logo; banda verde de marca con el título gigante de cada paso; contenido en blanco a la izquierda y el chat (verde suave) a la derecha. Identidad 100% Brand Book Dodo Chat, tema claro único. */
:root{
  --verde:#00B45F;      /* verde logo */
  --verde-osc:#2F6B33;
  --verde-med:#6DC468;
  --verde-sua:#BDECCC;
  --verde-claro:#F4FBEF;
  --burbuja:#D8F7C8;
  --azul:#7B9AE8;
  --azul-sua:#CBDAFB;
  --azul-claro:#EEF4FC;
  --agua:#EEF9F7;
  --blanco:#FFFFFF;
  --papel:#FAFAF6;
  --tinta:#10261A;
  --tinta-2:#10261AB3;
  --linea:#10261A14;
  --alerta:#D9433B;
  --f-titulo:Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-texto:"Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0}
html,body{background:var(--blanco);color:var(--tinta)}
body{font:400 15px/1.6 var(--f-texto)}
h1,h2,h3,.titulo{font-family:var(--f-titulo);text-wrap:balance}
h1{font-weight:900;letter-spacing:-.035em;line-height:.95;font-size:clamp(2.4rem,6vw,4.6rem)}
h2{font-weight:900;letter-spacing:-.03em;line-height:1;font-size:clamp(1.5rem,2.6vw,2.1rem)}
h3{font-weight:700;letter-spacing:-.01em;line-height:1.2;font-size:1.08rem}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:3px solid var(--azul);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.suave{color:var(--tinta-2)}
.chico{font-size:.84rem}
.tec{font-size:.78rem;color:var(--tinta-2);letter-spacing:.01em}

/* pills: el estilo del Brand Book (contorno, currentColor) */
.pill{display:inline-flex;align-items:center;gap:.5em;border-radius:99px;padding:.38em 1.05em;border:1.5px solid currentColor;font-size:.88rem;font-weight:600;white-space:nowrap;line-height:1.3}
.pill.lleno{background:var(--verde);border-color:var(--verde);color:var(--blanco)}
.pill.tinta{background:var(--tinta);border-color:var(--tinta);color:var(--blanco)}
.pill.verde{color:var(--verde-osc)}
.pill.alerta{color:var(--alerta)}
.pill:is(button):hover{background:var(--verde-claro)}
.pill.lleno:is(button):hover{background:var(--verde-osc);border-color:var(--verde-osc)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--blanco);border-bottom:1px solid var(--linea)}
.top-in{max-width:1320px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{height:38px;width:auto;display:block}
.producto{font-family:var(--f-titulo);font-weight:700;color:var(--verde-osc);padding-left:16px;border-left:1.5px solid var(--verde-sua);font-size:1.02rem;margin-right:auto}
.ejemplo{font-size:.78rem;color:var(--tinta-2)}
.revisar{padding:.6em 1.4em;font-size:.95rem}

/* pasos */
.pasos{max-width:1320px;margin:0 auto;padding:0 24px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}
.grupo{display:flex;flex-direction:column;gap:2px;padding-top:12px}
.grupo>span{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--tinta-2);font-weight:600}
.grupo div{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.paso{display:flex;align-items:baseline;gap:8px;padding:10px 4px 12px;border-bottom:3px solid transparent;text-align:left;min-width:0}
.paso b{font-family:var(--f-titulo);font-weight:900;font-size:1.35rem;letter-spacing:-.04em;color:var(--verde-sua)}
.paso span{font-weight:600;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.paso:hover b{color:var(--verde-med)}
.paso[aria-current="page"]{border-bottom-color:var(--verde)}
.paso[aria-current="page"] b{color:var(--verde)}

/* banda verde del paso */
.banda{background:var(--verde);color:var(--blanco);position:relative;overflow:hidden}
.banda-in{max-width:1320px;margin:0 auto;padding:clamp(28px,4vw,52px) 24px clamp(30px,4vw,48px);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;position:relative}
.banda p{font-size:clamp(1rem,1.4vw,1.18rem);max-width:36em;margin-top:14px;opacity:.95}
.banda .n{font-family:var(--f-titulo);font-weight:900;letter-spacing:-.05em;line-height:.8;font-size:clamp(5rem,13vw,11rem);color:#ffffff38;user-select:none}
.banda.vivo{background:var(--alerta)}

/* cuerpo */
.cuerpo{max-width:1320px;margin:0 auto;padding:28px 24px 64px;display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:32px;align-items:start}
main{min-width:0;display:flex;flex-direction:column;gap:22px}
.bloque{border-radius:28px;padding:clamp(20px,2.6vw,32px);background:var(--blanco);border:1px solid var(--linea);display:flex;flex-direction:column;gap:16px;min-width:0}
.bloque.sua{background:var(--verde-claro);border:0}
.bloque.azul{background:var(--azul-claro);border:0}
.fila{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sep{border:0;border-top:1px solid var(--linea)}

/* voz del agente dentro de las pantallas: una burbuja de chat */
.voz{display:flex;gap:12px;align-items:flex-end}
.voz img{width:40px;height:40px;flex:none}
.voz .b{background:var(--blanco);border-radius:20px 20px 20px 4px;padding:14px 18px;border:1px solid var(--linea);max-width:62ch}
.bloque.azul .voz .b,.bloque.sua .voz .b{border-color:transparent}

/* 01 formulario */
.dom{display:flex;flex-direction:column;gap:4px}
.dom-h{display:flex;align-items:baseline;gap:14px;padding-bottom:8px}
.dom-h h3{font-size:1.3rem;font-weight:900;letter-spacing:-.025em;margin-right:auto}
.dom-h .pts{font-family:var(--f-titulo);font-weight:900;font-size:2rem;letter-spacing:-.04em;line-height:1}
.dom-h .pts small{font-size:.8rem;font-weight:500;color:var(--tinta-2);letter-spacing:0}
.linea-pts{height:4px;background:var(--verde-claro);border-radius:4px;overflow:hidden;margin-bottom:6px}
.linea-pts i{display:block;height:100%;background:var(--verde);transition:width .35s}
.preg{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--linea)}
.resp{display:flex;gap:6px}
.resp button{border:1.5px solid var(--verde-sua);border-radius:99px;padding:.3em .95em;font-size:.86rem;font-weight:600;color:var(--verde-osc)}
.resp button:hover{border-color:var(--verde)}
.resp button[aria-pressed="true"]{background:var(--verde);border-color:var(--verde);color:var(--blanco)}

/* 02 informes */
.inf{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 0;border-top:1px solid var(--linea)}
.inf:first-child{border-top:0;padding-top:0}
.inf h3{font-size:1rem}
.soltar{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:2px dashed var(--verde-med);border-radius:28px;padding:28px 20px;background:var(--verde-claro);cursor:pointer}
.soltar.sobre{background:var(--verde-sua)}
.soltar input{display:none}
.soltar .titulo{font-weight:900;font-size:1.25rem;letter-spacing:-.02em;color:var(--verde-osc)}

/* 03 negocio: números grandes editables, como las listas del Brand Book */
.grandes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 28px}
.grande{display:flex;flex-direction:column;padding:14px 0;border-bottom:1px solid var(--linea)}
.grande label{font-size:.88rem;color:var(--tinta-2);font-weight:600;order:2}
.grande input{order:1;border:0;background:none;font-family:var(--f-titulo);font-weight:900;font-size:clamp(2.2rem,4.5vw,3.4rem);letter-spacing:-.04em;line-height:1.05;color:var(--tinta);width:100%;padding:0;font-variant-numeric:tabular-nums}
.grande input:focus{color:var(--verde)}
.grande.cambio input{color:var(--verde)}
.aviso{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--azul-sua);border-radius:20px;padding:14px 18px}
.lista{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--linea)}
.item:first-child{border-top:0}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88rem}

/* 04 informe */
.veredicto{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center}
.puntaje{font-family:var(--f-titulo);font-weight:900;letter-spacing:-.06em;line-height:.8;font-size:clamp(5.5rem,12vw,9rem);color:var(--verde)}
.puntaje small{font-size:.22em;letter-spacing:0;color:var(--tinta-2);font-weight:500}
.cifras{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0 28px}
.cifra{padding:14px 0;border-bottom:1px solid var(--linea)}
.cifra b{display:block;font-family:var(--f-titulo);font-weight:900;font-size:2.4rem;letter-spacing:-.04em;line-height:1.05}
.hall{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:18px;padding:18px 0;border-top:1px solid var(--linea);align-items:start}
.hall:first-child{border-top:0;padding-top:0}
.hall.aprobado{background:linear-gradient(90deg,var(--verde-claro),transparent 70%);border-radius:14px}
.hall.descartado{opacity:.4}
.hall h3{margin-bottom:4px}
.nivel{display:flex;flex-direction:column;gap:6px;font-size:.8rem;font-weight:700}
.barras{display:flex;gap:3px;align-items:flex-end;height:18px}
.barras i{width:7px;border-radius:2px;background:var(--linea)}
.barras i:nth-child(1){height:6px}.barras i:nth-child(2){height:10px}.barras i:nth-child(3){height:14px}.barras i:nth-child(4){height:18px}
.barras i.on{background:var(--tinta)}
.nivel.critico{color:var(--alerta)}
.nivel.critico .barras i.on{background:var(--alerta)}
.decidir{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

/* 05 dashboard */
.grafico svg{width:100%;height:auto;display:block}
.medidor{display:grid;grid-template-columns:120px minmax(0,1fr) 44px;gap:12px;align-items:center;padding:7px 0}
.medidor .linea-pts{margin:0;height:8px}
.medidor b{font-family:var(--f-titulo);font-weight:900;text-align:right}
.dos{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px}

/* 06 playbook */
.fases{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.fase{border-radius:28px;padding:22px;display:flex;flex-direction:column;gap:12px;min-height:300px}
.fase:nth-child(1){background:var(--verde-claro)}
.fase:nth-child(2){background:var(--agua)}
.fase:nth-child(3){background:var(--azul-claro)}
.fase.vivo{box-shadow:inset 0 0 0 2.5px var(--alerta)}
.fase .k{font-family:var(--f-titulo);font-weight:900;color:var(--verde-osc);font-size:.95rem}
.fase h3{font-size:1.4rem;font-weight:900;letter-spacing:-.025em}
.tarea{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;font-size:.92rem;cursor:pointer;padding:6px 0;border-top:1px solid var(--linea)}
.tarea input{appearance:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--verde-osc);margin-top:2px;display:grid;place-items:center;background:var(--blanco)}
.tarea input:checked{background:var(--verde);border-color:var(--verde)}
.tarea input:checked::after{content:"";width:6px;height:10px;border:solid var(--blanco);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.tarea input:checked+span{color:var(--tinta-2);text-decoration:line-through;text-decoration-color:var(--verde-med)}
.tarea small{display:block;color:var(--tinta-2);font-size:.78rem}
.reloj{font-family:var(--f-titulo);font-weight:900;font-size:1.6rem;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

/* chat */
aside.chat{position:sticky;top:150px;height:calc(100vh - 170px);min-height:460px;max-height:780px;display:flex;flex-direction:column;background:var(--verde-claro);border-radius:28px;overflow:hidden}
.chat-h{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--blanco);border-bottom:1px solid var(--linea)}
.chat-h img{width:40px;height:40px}
.chat-h b{font-family:var(--f-titulo);font-weight:700;display:block;line-height:1.2}
.chat-h small{font-size:.78rem;color:var(--verde-osc);display:flex;align-items:center;gap:6px}
.chat-h small::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--verde)}
.cerrar{margin-left:auto;font-size:1.6rem;line-height:1;color:var(--tinta-2);display:none;padding:0 4px}
.msgs{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:88%;padding:12px 16px;font-size:.92rem;line-height:1.5}
.m.u{background:var(--burbuja);border-radius:20px 20px 4px 20px;align-self:flex-end}
.m.b{background:var(--blanco);border-radius:20px 20px 20px 4px;align-self:flex-start}
.m time{display:block;text-align:right;font-size:.68rem;color:var(--tinta-2);margin-top:4px}
.m ul{margin:6px 0 0;padding-left:18px}
.escribe{display:inline-flex;gap:4px;padding:4px 0}
.escribe i{width:7px;height:7px;border-radius:50%;background:var(--verde-med);animation:lat 1s infinite}
.escribe i:nth-child(2){animation-delay:.15s}.escribe i:nth-child(3){animation-delay:.3s}
@keyframes lat{0%,100%{opacity:.3}50%{opacity:1}}
.sugerencias{display:flex;gap:6px;overflow-x:auto;padding:0 14px 10px;scrollbar-width:none}
.sugerencias button{flex:none;border:1.5px solid var(--verde-med);background:var(--blanco);border-radius:99px;padding:.35em .95em;font-size:.82rem;font-weight:600;color:var(--verde-osc)}
.redactar{display:flex;gap:8px;padding:10px 12px 14px}
.redactar input{flex:1;min-width:0;border:0;border-radius:99px;padding:12px 18px;background:var(--blanco);color:var(--tinta);font:inherit}
.redactar button{width:46px;height:46px;border-radius:50%;background:var(--verde);display:grid;place-items:center;flex:none}
.redactar button:hover{background:var(--verde-osc)}
.flotante{display:none;position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;width:64px;height:64px;border-radius:50%;filter:drop-shadow(0 6px 14px #10261A40)}
.flotante img{width:100%;height:100%}

/* revisión en curso */
.velo{position:fixed;inset:0;background:#10261A80;display:grid;place-items:center;z-index:50;padding:16px}
.progreso{background:var(--blanco);border-radius:28px;padding:30px;width:min(460px,100%);display:flex;flex-direction:column;gap:14px}
.progreso img{width:56px;height:56px}
.ps{display:flex;gap:12px;align-items:center;color:var(--tinta-2)}
.ps i{width:20px;height:20px;border-radius:50%;border:2px solid var(--verde-sua);flex:none}
.ps.va{color:var(--tinta)}.ps.va i{border-color:var(--verde);border-top-color:transparent;animation:gira .8s linear infinite}
.ps.ok{color:var(--tinta)}.ps.ok i{background:var(--verde);border-color:var(--verde)}
@keyframes gira{to{transform:rotate(360deg)}}
.aviso-t{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--verde-osc);color:var(--blanco);padding:12px 22px;border-radius:99px;font-size:.9rem;font-weight:600;z-index:60;max-width:calc(100vw - 32px);text-align:center}

@media (max-width:1180px){
  .cuerpo{grid-template-columns:minmax(0,1fr)}
  aside.chat{position:fixed;right:16px;bottom:16px;top:auto;width:min(390px,calc(100vw - 32px));height:min(640px,calc(100vh - 100px));z-index:40;box-shadow:0 18px 50px #10261A40;display:none}
  aside.chat.abierto{display:flex}
  .cerrar{display:block}
  .flotante{display:block}
}
@media (max-width:820px){
  .pasos{grid-template-columns:minmax(0,1fr);gap:0}
  .paso span{font-size:.82rem}
  .banda .n{display:none}
  .banda-in{grid-template-columns:minmax(0,1fr)}
  .preg,.inf,.item{grid-template-columns:minmax(0,1fr)}
  .hall{grid-template-columns:minmax(0,1fr)}
  .nivel{flex-direction:row;align-items:center}
  .decidir{justify-content:flex-start}
  .fases{grid-template-columns:minmax(0,1fr)}
  .fase{min-height:0}
  .veredicto{grid-template-columns:minmax(0,1fr);gap:12px}
  .producto{display:none}
  .top-in,.pasos,.banda-in,.cuerpo{padding-left:16px;padding-right:16px}
}
@media (max-width:480px){
  .paso{flex-direction:column;gap:0}
  .paso span{font-size:.74rem}
  .ejemplo{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  <div class="fases">
   <section class="fase"><span class="k">Antes</span><h3>Estar listos</h3>${tareas(ANTES,'pre')}</section>
   <section class="fase ${vivo?'vivo':''}"><span class="k">Durante</span><h3>Contener</h3>${tareas(P.dur,'dur')}</section>
   <section class="fase"><span class="k">Después</span><h3>Recuperar y aprender</h3>${tareas(DESPUES,'post')}</section>
  </div>`;
}};

function pintar(){ $('#main').innerHTML = VISTAS[state.paso](); if(state.paso==='playbook') reloj(); }

document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-ir]'); if(!t) return;
  if(t.dataset.ir) return ir(t.dataset.ir);
  if(t.dataset.resp){ const [d,q,v]=t.dataset.resp.split('.'); state.form[d].q[q][1]=v; pintar(); return; }
  if(t.dataset.dato){ state.datos[t.dataset.dato]=!state.datos[t.dataset.dato]; pintar(); return; }
  if(t.dataset.dec){ const [id,v]=t.dataset.dec.split('.'); state.decisiones[id]=v; pintar(); aviso(v==='aprobado'?'Aprobada. Pasa al playbook.':'Descartada.'); return; }
  if(t.dataset.inc){ state.incidente=t.dataset.inc; pintar(); return; }
  if(t.id==='activar'){ state.vivo=Date.now(); pintarBanda(); pintar(); window.scrollTo({top:0}); bot(`Activé el plan de <b>${PLAY[state.incidente].t.toLowerCase()}</b>. Primero: ${PLAY[state.incidente].dur[0][0].toLowerCase()}. Estoy acá.`); abrirChat(); return; }
  if(t.id==='cerrarInc'){ state.vivo=null; pintarBanda(); pintar(); aviso('Incidente cerrado. Subí el informe y actualizo el plan.'); return; }
  if(t.dataset.revisar!==undefined || t.id==='revisar') return revisar();
});
document.addEventListener('change', e => {
  const t=e.target;
  if(t.dataset.biz){ state.biz[t.dataset.biz]=Number(t.value)||0; pintar(); }
  if(t.dataset.hecha){ state.hechas[t.dataset.hecha]=t.checked; pintar(); }
  if(t.id==='archivo') recibir(t.files);
});
document.addEventListener('dragover', e => { const d=e.target.closest('#soltar'); if(d){ e.preventDefault(); d.classList.add('sobre'); } });
document.addEventListener('dragleave', e => { const d=e.target.closest('#soltar'); if(d) d.classList.remove('sobre'); });
document.addEventListener('drop', e => { const d=e.target.closest('#soltar'); if(d){ e.preventDefault(); recibir(e.dataTransfer.files); } });

function recibir(files){
  const ok=[];
  [...files].forEach(f=>{ const n=f.name.toLowerCase(); const r=state.informes.find(r=>n.includes(r.k))||state.informes.find(r=>r.st!=='ok'); if(r){ r.st='ok'; r.fecha='12/10/2026'; r.info='Recibido hoy'; ok.push(r.tool); } });
  pintar(); if(ok.length) aviso('Recibido: '+ok.join(', '));
}

let tic=null;
function reloj(){ clearInterval(tic); if(!state.vivo) return; const up=()=>{ const el=$('#reloj'); if(!el) return clearInterval(tic); const s=Math.floor((Date.now()-state.vivo)/1000); el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }; up(); tic=setInterval(up,1000); }
function aviso(msg){ const t=document.createElement('div'); t.className='aviso-t'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2800); }

function revisar(){
  const pasos=['Leyendo los informes OWASP y de la nube','Cruzando con el formulario','Midiendo el impacto con los datos del negocio','Comparando con NIST, ISO 27001, OWASP y la Ley 25.326','Armando informe, dashboard y playbook'];
  const v=document.createElement('div'); v.className='velo';
  v.innerHTML=`<div class="progreso" role="status"><img src="${ESCUDO}" alt=""><h2>Revisando.</h2>${pasos.map((s,i)=>`<div class="ps" id="ps${i}"><i></i>${s}</div>`).join('')}</div>`;
  document.body.appendChild(v); $('#revisar').disabled=true;
  let i=0; const sig=()=>{ if(i>0) $('#ps'+(i-1)).className='ps ok'; if(i===pasos.length){ setTimeout(()=>{ v.remove(); $('#revisar').disabled=false; ir('informe'); bot('Listo. <b>58 sobre 100.</b> Lo urgente es la falla de la API que deja ver historias clínicas. ¿Te cuento cómo corregirla?'); },400); return; } $('#ps'+i).className='ps va'; i++; setTimeout(sig,650); };
  sig();
}

/* chat */
const hora=()=>new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
function msg(html,quien){ const m=document.createElement('div'); m.className='m '+quien; m.innerHTML=html+`<time>${hora()}</time>`; $('#msgs').appendChild(m); $('#msgs').scrollTop=1e6; }
function bot(html){ const t=document.createElement('div'); t.className='m b'; t.innerHTML='<span class="escribe"><i></i><i></i><i></i></span>'; $('#msgs').appendChild(t); $('#msgs').scrollTop=1e6; setTimeout(()=>{ t.remove(); msg(html,'b'); },750); }
const SUG=['¿Qué informes faltan?','Un médico perdió el celular','¿Cómo estamos?','¿Cada cuánto se revisa?'];
function responder(q){
  const s=q.toLowerCase();
  if(/falta|subir|informe/.test(s)){ const f=state.informes.filter(r=>r.st!=='ok'); return f.length?`Faltan ${f.length}:<ul>${f.map(r=>`<li><b>${r.tool}</b>: ${r.info.toLowerCase()}</li>`).join('')}</ul>Se cargan en el paso 02.`:'Están todos al día.'; }
  if(/celular|perd|rob/.test(s)){ state.incidente='celular'; ir('playbook'); return 'Tranquilos, tiene solución. Abrí el plan de <b>celular perdido</b>:<ul><li>Cerrar su sesión de WhatsApp Business y de Dodo Chat</li><li>Borrar el equipo a distancia, si se puede</li><li>Cambiar sus contraseñas</li></ul>Tocá “Activar plan” y medimos el tiempo.'; }
  if(/cómo|como|estamos|riesgo|puntaje/.test(s)) return `<b>${puntaje()} sobre 100</b>, doce puntos más que en junio. Queda una urgencia: la falla de la API. Lo más flojo del equipo es <b>${[...state.form].sort((a,b)=>pts(a)-pts(b))[0].d.toLowerCase()}</b>.`;
  if(/cada|cuándo|cuando|revis/.test(s)) return 'Todos los meses con OWASP ZAP y Amass, en cada cambio de código con Dependency-Check y cada tres meses con el formulario. Y además, cada vez que cambia algo: un servidor, un dominio, el equipo o un proveedor.';
  if(/api|owasp|corregir|s[ií]/.test(s)) return 'El servidor tiene que verificar que cada historia clínica sea del médico que la pide, no solo que esté logueado. Cuando esté, volvemos a pasar OWASP ZAP para confirmarlo.';
  return 'Te puedo ayudar con los informes, cómo estamos, o qué hacer si algo pasa. Probá con una sugerencia.';
}
function preguntar(q){ msg(esc(q),'u'); bot(responder(q)); }
$('#sugerencias').innerHTML=SUG.map(q=>`<button type="button" data-q="${esc(q)}">${q}</button>`).join('');
$('#sugerencias').addEventListener('click',e=>{ const b=e.target.closest('[data-q]'); if(b){ e.stopPropagation(); preguntar(b.dataset.q); } });
$('#redactar').addEventListener('submit',e=>{ e.preventDefault(); const v=$('#entrada').value.trim(); if(!v) return; $('#entrada').value=''; preguntar(v); });
function abrirChat(){ $('#chat').classList.add('abierto'); }
$('#flotante').addEventListener('click',e=>{ e.stopPropagation(); abrirChat(); });
$('#cerrar').addEventListener('click',e=>{ e.stopPropagation(); $('#chat').classList.remove('abierto'); });

msg('Hola. Soy Escudo, de Dodo Chat. Completá el formulario y subí los informes; yo armo el plan y te aviso qué hacer primero.','b');

try{ const p=localStorage.getItem('escudo-paso'); if(p && VISTAS[p]) state.paso=p; }catch(e){}
pintarPasos(); pintarBanda(); pintar();
</script>

</body></html>
